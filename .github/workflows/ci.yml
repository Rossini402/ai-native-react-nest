name: AI-Native Verification Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Governance + Lint + Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build shared contracts
        run: pnpm --filter @repo/contracts build

      - name: Run unified AI-Native verification harness
        run: ./scripts/verify.sh

      - name: Build Storybook static bundle (CSF3 verification)
        run: pnpm storybook:build
