services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-native-react-nest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
      POSTGRES_DB: ai_native_react_nest_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_native_react_nest_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
